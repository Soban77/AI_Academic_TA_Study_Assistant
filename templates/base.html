<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AI Academic TA & Study Assistant{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 antialiased">
    <div class="min-h-screen">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="max-w-6xl mx-auto pt-4 px-4">
            {% for category, message in messages %}
              <div class="rounded-lg px-4 py-3 mb-3 {% if category == 'error' %}bg-red-100 text-red-700{% else %}bg-emerald-100 text-emerald-700{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </div>
  </body>
</html>
